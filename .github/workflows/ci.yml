name: ci

on:
  push:
    branches: [mac-qwen-metal, main]
  pull_request:

jobs:
  pytest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[ci]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reader playback behavior
        run: node --test tests/test_reader_playback.cjs tests/test_reader_player.cjs tests/test_reader_library.cjs
      - name: Native macOS behavior and reader compilation
        run: ./scripts/test_native_macos.sh
