[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-tts-generator-macos"
version = "0.1.0"
description = "Persistent Qwen3-TTS web service for Apple Silicon Metal"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.51.0",
  "python-multipart==0.0.32",
  "orjson==3.11.4",
  "numpy>=2.0",
  "soundfile>=0.12",
  "huggingface-hub>=0.36,<1.0",
]

[tool.setuptools.packages.find]
include = ["qwen_tts_service*"]

[project.urls]
FasterQwen3TTS = "https://github.com/andimarafioti/faster-qwen3-tts"
Qwen3TTS = "https://github.com/QwenLM/Qwen3-TTS"
QwenTTSCPP = "https://github.com/ServeurpersoCom/qwentts.cpp"
